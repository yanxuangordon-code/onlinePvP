name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Railway URL into config.js
        if: ${{ vars.RAILWAY_URL != '' }}
        run: |
          sed -i "s|window.SOCKET_SERVER_URL = null;|window.SOCKET_SERVER_URL = '${{ vars.RAILWAY_URL }}';|" client/config.js

      - name: Copy static files to dist
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r client dist/
          cp -r assets dist/
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
